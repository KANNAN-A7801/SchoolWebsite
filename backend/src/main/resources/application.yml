server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: lms-backend

  datasource:
    url: jdbc:mysql://localhost:3306/SchoolDataBase?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    secret: 9a2f8c4e7b1d3a5f6e8d2c4b6a8f1e3d5c7b9a2f4e6d8c1b3a5f7e9d2c4b6a8f
    expiration-ms: 86400000 # 24 Hours

supabase:
  url: https://your-supabase-project.supabase.co
  service-key: your-supabase-service-key
  bucket: student-tasks
